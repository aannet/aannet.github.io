.hud{position:fixed;pointer-events:none;text-shadow:0 0 6px #ff2bd6,0 0 14px #ff2bd6}

.ov h1{font-size:46px;margin:0 0 4px;letter-spacing:8px;background:linear-gradient(#ffe86b,#ff2bd6 60%,#7a2bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #ff2bd6)}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const V3 = THREE.Vector3;
const W = 26, HALF = W / 2, LAPS = 3, VMAX = 150, BOOSTMAX = VMAX * 1.55, LAT = 32, KMH = 6.4, GROUND = -80;
const $ = id => document.getElementById(id);

// ---------- Renderer / scène ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: false, powerPreference: 'high-performance' });
let pixelRatio = Math.min(devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0221);
scene.fog = new THREE.Fog(0x1a0538, 140, 950);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.5, 3200);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0x8a5cff, 0x220033, 1.3));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(200, 400, 100);
scene.add(dirLight);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.85, 0.35, 0.18);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let fx = true;

// ---------- Piste ----------
const CTRL = [
  [0,0,0],[0,0,-300],[40,10,-500],[180,30,-620],[360,40,-600],[480,20,-480],[500,0,-300],
  [420,-10,-160],[300,0,-80],[260,20,40],[320,50,180],[460,60,260],[560,40,400],[520,10,560],
  [360,0,620],[160,-10,600],[20,0,520],[-120,20,420],[-260,40,440],[-380,30,320],[-360,10,160],
  [-200,0,80],[-60,0,60]
].map(p => new V3(p[0], p[1], p[2]));
const curve = new THREE.CatmullRomCurve3(CTRL, true, 'centripetal');
const L = curve.getLength();
const N = 1600, DS = L / N;
const P = [], T = [], R = [], U = [], R0 = [];
const K = new Float32Array(N);
const up0 = new V3(0, 1, 0);
for (let i = 0; i < N; i++) {
  P.push(curve.getPointAt(i / N));
  T.push(curve.getTangentAt(i / N).normalize());
}
for (let i = 0; i < N; i++) R0.push(new V3().crossVectors(T[i], up0).normalize());
// courbure signée (>0 = virage à droite)
let raw = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const a = T[(i + 1) % N], b = T[(i - 1 + N) % N];
  raw[i] = ((a.x - b.x) * R0[i].x + (a.y - b.y) * R0[i].y + (a.z - b.z) * R0[i].z) / (2 * DS);
}
for (let pass = 0; pass < 2; pass++) {
  const out = new Float32Array(N), win = 30;
  for (let i = 0; i < N; i++) {
    let s = 0;
    for (let j = -win; j <= win; j++) s += raw[(i + j + N) % N];
    out[i] = s / (2 * win + 1);
  }
  raw = out;
}
K.set(raw);
let KMAX = 1e-6;
const q = new THREE.Quaternion();
for (let i = 0; i < N; i++) {
  const bank = THREE.MathUtils.clamp(K[i] * 45, -0.55, 0.55);
  q.setFromAxisAngle(T[i], bank);
  const r = R0[i].clone().applyQuaternion(q);
  R.push(r);
  U.push(new V3().crossVectors(r, T[i]).normalize());
  KMAX = Math.max(KMAX, Math.abs(K[i]));
}
const CF = 0.5 * LAT / (KMAX * VMAX * VMAX);

const mkF = () => ({ p: new V3(), t: new V3(), r: new V3(), u: new V3(), k: 0 });
function frame(s, o) {
  s = ((s % L) + L) % L;
  const f = s / DS, i = Math.floor(f) % N, j = (i + 1) % N, w = f - Math.floor(f);
  o.p.lerpVectors(P[i], P[j], w);
  o.t.lerpVectors(T[i], T[j], w).normalize();
  o.r.lerpVectors(R[i], R[j], w).normalize();
  o.u.lerpVectors(U[i], U[j], w).normalize();
  o.k = K[i] * (1 - w) + K[j] * w;
  return o;
}
const Ftmp = mkF();
function trackPos(s, x, h, out) {
  const f = frame(s, Ftmp);
  return out.copy(f.p).addScaledVector(f.r, x).addScaledVector(f.u, h);
}

function stripGeo(s0, len, steps, ax, ah, bx, bh, vRep) {
  const pos = new Float32Array((steps + 1) * 6), uv = new Float32Array((steps + 1) * 4), idx = [];
  const f = mkF(), a = new V3(), b = new V3();
  for (let i = 0; i <= steps; i++) {
    const d = len * i / steps;
    frame(s0 + d, f);
    a.copy(f.p).addScaledVector(f.r, ax).addScaledVector(f.u, ah);
    b.copy(f.p).addScaledVector(f.r, bx).addScaledVector(f.u, bh);
    pos.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6);
    uv.set([0, d / vRep, 1, d / vRep], i * 4);
    if (i < steps) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// Surface
const trackTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#120326'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(0,229,255,.28)';
  for (const u of [.25, .5, .75]) g.fillRect(u * w - 1, 0, 2, h);
  g.fillRect(0, 0, w, 2);
  g.fillStyle = 'rgba(0,229,255,.7)'; g.fillRect(0.5 * w - 2, 0, 4, h * 0.45);
  g.fillStyle = '#ff2bd6'; g.fillRect(0, 0, w * 0.045, h); g.fillRect(w * 0.955, 0, w * 0.045, h);
  g.fillStyle = '#7df9ff'; g.fillRect(w * 0.06, 0, 2, h); g.fillRect(w * 0.94 - 2, 0, 2, h);
});
scene.add(new THREE.Mesh(stripGeo(0, L, N, -HALF, 0, HALF, 0, 20),
  new THREE.MeshBasicMaterial({ map: trackTex, side: THREE.DoubleSide })));

// Murs
const wallMat = c => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: .22, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
scene.add(new THREE.Mesh(stripGeo(0, L, N, -HALF, 0, -HALF, 1.8, 1), wallMat(0xff2bd6)));
scene.add(new THREE.Mesh(stripGeo(0, L, N, HALF, 0, HALF, 1.8, 1), wallMat(0x00e5ff)));
function railLine(x, h, color) {
  const pts = [], v = new V3();
  for (let i = 0; i < N; i++) pts.push(trackPos(i * DS, x, h, v).clone());
  return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color }));
}
scene.add(railLine(-HALF, 1.8, 0xff7be8), railLine(HALF, 1.8, 0x9ffbff));

// Balises
{
  const step = 16, count = (N / step) * 2;
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(0.6, 2.8, 0.6), new THREE.MeshBasicMaterial({ color: 0xffffff }), count);
  const m = new THREE.Matrix4(), f = mkF(), pos = new V3(), back = new V3(), col = new THREE.Color();
  let n = 0;
  for (let i = 0; i < N; i += step) {
    for (const side of [-1, 1]) {
      frame(i * DS, f);
      pos.copy(f.p).addScaledVector(f.r, side * (HALF + 0.5)).addScaledVector(f.u, 1.4);
      back.copy(f.t).negate();
      m.makeBasis(f.r, f.u, back).setPosition(pos);
      im.setMatrixAt(n, m);
      im.setColorAt(n, col.set((i / step) % 2 ? 0xffe86b : (side < 0 ? 0xff2bd6 : 0x00e5ff)));
      n++;
    }
  }
  scene.add(im);
}

// Piliers vers le sol
{
  const pts = [], v = new V3();
  for (let i = 0; i < N; i += 32) {
    for (const x of [-HALF * 0.7, HALF * 0.7]) {
      trackPos(i * DS, x, -0.2, v);
      pts.push(v.clone(), new V3(v.x, GROUND, v.z));
    }
  }
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x5a1a8a })));
}

// Ligne de départ + arche
{
  const chk = canvasTex(256, 32, (g, w, h) => {
    for (let x = 0; x < 16; x++) for (let y = 0; y < 2; y++) {
      g.fillStyle = (x + y) % 2 ? '#ffffff' : '#1a0538'; g.fillRect(x * 16, y * 16, 16, 16);
    }
  }, false);
  const line = new THREE.Mesh(stripGeo(L - 1.5, 3, 2, -HALF, 0.03, HALF, 0.03, 3), new THREE.MeshBasicMaterial({ map: chk, side: THREE.DoubleSide }));
  scene.add(line);
  const f = frame(0, mkF()), mat = new THREE.MeshBasicMaterial({ color: 0xff2bd6 });
  const arch = new THREE.Group();
  const m = new THREE.Matrix4().makeBasis(f.r, f.u, f.t.clone().negate());
  arch.quaternion.setFromRotationMatrix(m);
  arch.position.copy(f.p);
  for (const s of [-1, 1]) {
    const pil = new THREE.Mesh(new THREE.BoxGeometry(1, 11, 1), mat);
    pil.position.set(s * (HALF + 1.5), 5.5, 0); arch.add(pil);
  }
  const beam = new THREE.Mesh(new THREE.BoxGeometry(W + 4, 1.2, 1), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
  beam.position.set(0, 11, 0); arch.add(beam);
  scene.add(arch);
}

// Plaques de boost
const padTex = canvasTex(128, 256, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  g.strokeStyle = '#7df9ff'; g.lineWidth = 14; g.lineJoin = 'miter';
  g.shadowColor = '#00e5ff'; g.shadowBlur = 10;
  for (const y of [70, 190]) { g.beginPath(); g.moveTo(14, y + 44); g.lineTo(64, y); g.lineTo(114, y + 44); g.stroke(); }
});
const PADS = [[0.05, 0], [0.3, -5], [0.52, 5], [0.74, 0], [0.9, -4]].map(([fr, x]) => ({ s: fr * L, x, len: 18, w: 9 }));
{
  const mat = new THREE.MeshBasicMaterial({ map: padTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 });
  for (const p of PADS) scene.add(new THREE.Mesh(stripGeo(p.s, p.len, 8, p.x - p.w / 2, 0.05, p.x + p.w / 2, 0.05, p.len / 2), mat));
}

// ---------- Décor ----------
const grid = new THREE.GridHelper(6000, 120, 0xff2bd6, 0x4a1580);
grid.position.y = GROUND;
scene.add(grid);

const center = new V3(); P.forEach(p => center.add(p)); center.divideScalar(N);
{
  const M = 80, RAD = 1550, tri = [], lines = [];
  for (let i = 0; i < M; i++) {
    const a0 = i / M * Math.PI * 2, a1 = (i + 1) / M * Math.PI * 2, am = (a0 + a1) / 2;
    const r = RAD + Math.sin(i * 1.7) * 120;
    const hgt = 70 + Math.abs(Math.sin(i * 2.3) * Math.cos(i * 0.7)) * 260;
    const b0 = new V3(center.x + Math.cos(a0) * r, GROUND, center.z + Math.sin(a0) * r);
    const b1 = new V3(center.x + Math.cos(a1) * r, GROUND, center.z + Math.sin(a1) * r);
    const pk = new V3(center.x + Math.cos(am) * (r + 60), GROUND + hgt, center.z + Math.sin(am) * (r + 60));
    tri.push(b0, pk, b1);
    lines.push(b0, pk, pk, b1);
  }
  const mg = new THREE.BufferGeometry().setFromPoints(tri);
  scene.add(new THREE.Mesh(mg, new THREE.MeshBasicMaterial({ color: 0x14022e, side: THREE.DoubleSide, fog: false })));
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lines), new THREE.LineBasicMaterial({ color: 0xb21dff, fog: false })));
}
const sunTex = canvasTex(512, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 40, 0, 470);
  gr.addColorStop(0, '#ffe86b'); gr.addColorStop(0.55, '#ff6ac1'); gr.addColorStop(1, '#ff2bd6');
  g.fillStyle = gr; g.beginPath(); g.arc(256, 256, 210, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 8; i++) { const y = 280 + i * 24, th = 3 + i * 1.6; g.fillRect(0, y, w, th); }
}, false);
const sun = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshBasicMaterial({ map: sunTex, transparent: true, fog: false, depthWrite: false }));
sun.renderOrder = -1;
scene.add(sun);
const SUN_DIR = new V3(-0.35, 0.1, -1).normalize();
const stars = (() => {
  const pts = [];
  for (let i = 0; i < 700; i++) {
    const v = new V3(Math.random() * 2 - 1, Math.random() * 0.9 + 0.05, Math.random() * 2 - 1).normalize().multiplyScalar(2200);
    pts.push(v);
  }
  const s = new THREE.Points(new THREE.BufferGeometry().setFromPoints(pts), new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, fog: false, depthWrite: false }));
  s.renderOrder = -2;
  scene.add(s);
  return s;
})();

// ---------- Vaisseau (design original) ----------
function makeShip() {
  const g = new THREE.Group();
  const v = { N: [0, .25, -4], LW: [-2.6, 0, 1.5], RW: [2.6, 0, 1.5], RT: [0, .95, 1.3], RB: [0, -.35, 1.3], RL: [-.95, .25, 1.9], RR: [.95, .25, 1.9] };
  const faces = [['N','LW','RT'],['N','RT','RW'],['N','RB','LW'],['N','RW','RB'],['LW','RL','RT'],['RW','RT','RR'],['LW','RB','RL'],['RW','RR','RB'],['RT','RL','RR'],['RB','RR','RL']];
  const pos = []; faces.forEach(f => f.forEach(k => pos.push(...v[k])));
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x2a1550, metalness: .6, roughness: .35, flatShading: true, side: THREE.DoubleSide, emissive: 0x12052a })));
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 1), new THREE.LineBasicMaterial({ color: 0x7df9ff })));
  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(.5, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff2bd6 }));
  cockpit.scale.set(.8, .5, 1.8); cockpit.position.set(0, .55, -.8); g.add(cockpit);
  const finGeo = new THREE.BufferGeometry().setFromPoints([new V3(0, .1, .7), new V3(0, .1, 1.7), new V3(0, 1.2, 1.85)]);
  for (const s of [-1, 1]) {
    const fin = new THREE.Mesh(finGeo, new THREE.MeshBasicMaterial({ color: 0xffe86b, side: THREE.DoubleSide }));
    fin.position.x = s * 1.5; g.add(fin);
  }
  const flames = [];
  const fg = new THREE.ConeGeometry(.38, 2.4, 10); fg.translate(0, 1.2, 0); fg.rotateX(Math.PI / 2);
  const fm = new THREE.MeshBasicMaterial({ color: 0x7df9ff, transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false });
  const fm2 = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false });
  for (const s of [-1, 1]) {
    const f = new THREE.Mesh(fg, fm); f.position.set(s * .55, .25, 1.85); g.add(f); flames.push(f);
    const c = new THREE.Mesh(fg, fm2); c.scale.set(.45, .45, .6); c.position.copy(f.position); g.add(c); flames.push(c);
  }
  const glow = new THREE.Mesh(new THREE.CircleGeometry(1.7, 20), new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: .16, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.rotation.x = -Math.PI / 2; glow.position.y = -.9; g.add(glow);
  g.scale.setScalar(.9);
  return { g, flames };
}
const ship = makeShip();
scene.add(ship.g);

// ---------- Particules ----------
const SPK = 90;
const spkPos = new Float32Array(SPK * 3).fill(-9999), spkVel = new Float32Array(SPK * 3), spkLife = new Float32Array(SPK);
const spkGeo = new THREE.BufferGeometry(); spkGeo.setAttribute('position', new THREE.BufferAttribute(spkPos, 3));
scene.add(new THREE.Points(spkGeo, new THREE.PointsMaterial({ color: 0xffd36b, size: .7, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })));
let spkNext = 0;
function spawnSparks(p, t, u, v, n) {
  for (let k = 0; k < n; k++) {
    const i = spkNext; spkNext = (spkNext + 1) % SPK;
    spkPos[i * 3] = p.x; spkPos[i * 3 + 1] = p.y; spkPos[i * 3 + 2] = p.z;
    spkVel[i * 3] = t.x * v * .3 + (Math.random() - .5) * 20 + u.x * Math.random() * 10;
    spkVel[i * 3 + 1] = t.y * v * .3 + (Math.random() - .5) * 20 + u.y * Math.random() * 10;
    spkVel[i * 3 + 2] = t.z * v * .3 + (Math.random() - .5) * 20 + u.z * Math.random() * 10;
    spkLife[i] = .5;
  }
}
function updateSparks(dt) {
  for (let i = 0; i < SPK; i++) {
    if (spkLife[i] <= 0) continue;
    spkLife[i] -= dt;
    if (spkLife[i] <= 0) { spkPos[i * 3 + 1] = -9999; continue; }
    spkVel[i * 3 + 1] -= 40 * dt;
    spkPos[i * 3] += spkVel[i * 3] * dt; spkPos[i * 3 + 1] += spkVel[i * 3 + 1] * dt; spkPos[i * 3 + 2] += spkVel[i * 3 + 2] * dt;
  }
  spkGeo.attributes.position.needsUpdate = true;
}

// Lignes de vitesse (espace caméra)
const SL = 110;
const slData = [];
const slPos = new Float32Array(SL * 6);
for (let i = 0; i < SL; i++) {
  const a = Math.random() * Math.PI * 2, r = 4 + Math.random() * 9;
  slData.push({ x: Math.cos(a) * r, y: Math.sin(a) * r * .6, z: -Math.random() * 90 });
}
const slGeo = new THREE.BufferGeometry(); slGeo.setAttribute('position', new THREE.BufferAttribute(slPos, 3));
const slMat = new THREE.LineBasicMaterial({ color: 0x9ffbff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
const speedLines = new THREE.LineSegments(slGeo, slMat);
speedLines.frustumCulled = false;
camera.add(speedLines);
function updateSpeedLines(dt, v) {
  const len = 2 + v * .05;
  for (let i = 0; i < SL; i++) {
    const d = slData[i];
    d.z += v * dt * 1.2;
    if (d.z > 2) d.z = -90 + Math.random() * 10;
    slPos.set([d.x, d.y, d.z, d.x, d.y, d.z - len], i * 6);
  }
  slGeo.attributes.position.needsUpdate = true;
  slMat.opacity = THREE.MathUtils.clamp((v - 100) / 90, 0, .7);
}

// ---------- Audio ----------
let ac = null, master = null, eng = null, noiseBuf = null, sound = true;
function initAudio() {
  if (ac) { ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = sound ? .45 : 0; master.connect(ac.destination);
    const o1 = ac.createOscillator(); o1.type = 'sawtooth';
    const o2 = ac.createOscillator(); o2.type = 'square'; o2.detune.value = -1193;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 6;
    const g = ac.createGain(); g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
    o1.start(); o2.start();
    eng = { o1, o2, f, g };
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function engineUpdate(v, boost, active) {
  if (!eng) return;
  const t = ac.currentTime, fr = 50 + v * 1.1 + boost * 40;
  eng.o1.frequency.setTargetAtTime(fr, t, .05);
  eng.o2.frequency.setTargetAtTime(fr, t, .05);
  eng.f.frequency.setTargetAtTime(300 + v * 14 + boost * 800, t, .08);
  eng.g.gain.setTargetAtTime(active ? .1 : .03, t, .1);
}
function noise(dur, type, f0, f1, vol) {
  if (!ac) return;
  const t = ac.currentTime, src = ac.createBufferSource(); src.buffer = noiseBuf;
  const bq = ac.createBiquadFilter(); bq.type = type;
  bq.frequency.setValueAtTime(f0, t); bq.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(bq).connect(g).connect(master); src.start(t); src.stop(t + dur);
}
function beep(freq, dur, vol = .3, type = 'sine', when = 0) {
  if (!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur);
}
const sfx = {
  hit: () => noise(.25, 'lowpass', 1800, 150, .7),
  boost: () => { noise(.7, 'bandpass', 300, 3500, .5); beep(300, .4, .15, 'sawtooth'); beep(600, .4, .12, 'sawtooth', .08); },
  count: () => beep(440, .25, .35, 'square'),
  go: () => beep(880, .6, .35, 'square'),
  lap: () => [523, 659, 784, 1047].forEach((f, i) => beep(f, .25, .25, 'triangle', i * .08)),
};

// ---------- État ----------
const STORE = 'hyperlane.best.v1';
let best = { lap: null, total: null };
try { best = Object.assign(best, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
const saveBest = () => { try { localStorage.setItem(STORE, JSON.stringify(best)); } catch (e) {} };

const st = { mode: 'menu', s: 6, x: 0, v: 100, lat: 0, steer: 0, raceT: 0, lapStart: 0, laps: [], count: 0, boost: 0, shake: 0, wallCD: 0, padCD: 0, msgT: 0, endT: 0 };
const input = { tl: false, tr: false, kl: false, kr: false, kb: false };

function fmt(t) {
  if (t == null || !isFinite(t)) return '--:--.---';
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s.toFixed(3).padStart(6, '0')}`;
}
function flash(txt, dur = .9) { $('big').textContent = txt; st.msgT = dur; }
function refreshMenuRec() {
  $('menuRec').textContent = best.total ? `Record : ${fmt(best.total)} · meilleur tour ${fmt(best.lap)}` : '';
}
refreshMenuRec();

function startRace() {
  initAudio();
  try {
    const de = document.documentElement;
    if (!document.fullscreenElement && de.requestFullscreen) {
      de.requestFullscreen({ navigationUI: 'hide' }).then(() => screen.orientation?.lock?.('landscape')).catch(() => {});
    }
  } catch (e) {}
  $('menu').classList.add('hidden'); $('res').classList.add('hidden');
  Object.assign(st, { mode: 'countdown', s: 6, x: 0, v: 0, lat: 0, steer: 0, raceT: 0, lapStart: 0, laps: [], count: 3.999, boost: 0, shake: 0, wallCD: 0, padCD: 0 });
  perf.n = 0; perf.sum = 0; perf.done = false;
  lastCount = 4;
}
let lastCount = 4;

function finishRace() {
  st.mode = 'finish'; st.endT = 0;
  const total = st.laps.reduce((a, b) => a + b, 0);
  const bl = Math.min(...st.laps);
  const newTotal = !best.total || total < best.total, newLap = !best.lap || bl < best.lap;
  if (newTotal) best.total = total;
  if (newLap) best.lap = bl;
  saveBest(); refreshMenuRec();
  $('resBody').innerHTML =
    `<p style="font-size:26px">${fmt(total)} ${newTotal ? '<span class="rec">★ RECORD</span>' : ''}</p>` +
    st.laps.map((t, i) => `<p>Tour ${i + 1} : ${fmt(t)} ${t === bl ? (newLap ? '<span class="rec">★ record tour</span>' : '★') : ''}</p>`).join('') +
    `<p class="rec">Record : ${fmt(best.total)} · meilleur tour ${fmt(best.lap)}</p>`;
  flash('ARRIVÉE', 1.5);
}

// ---------- Entrées ----------
function readTouches(e) {
  let l = false, r = false;
  for (const t of e.touches) {
    const el = t.target;
    if (el && el.closest && el.closest('button,.ov:not(.hidden)')) continue;
    if (t.clientX < innerWidth / 2) l = true; else r = true;
  }
  input.tl = l; input.tr = r;
  const tg = e.target;
  if (!(tg && tg.closest && tg.closest('button,.ov'))) e.preventDefault();
}
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(n => addEventListener(n, readTouches, { passive: false }));
addEventListener('keydown', e => {
  if (['ArrowLeft', 'a', 'q', 'A', 'Q'].includes(e.key)) input.kl = true;
  if (['ArrowRight', 'd', 'D'].includes(e.key)) input.kr = true;
  if ([' ', 'ArrowDown', 's', 'S'].includes(e.key)) input.kb = true;
  if (e.key === 'Enter' && (st.mode === 'menu' || st.mode === 'finish')) startRace();
});
addEventListener('keyup', e => {
  if (['ArrowLeft', 'a', 'q', 'A', 'Q'].includes(e.key)) input.kl = false;
  if (['ArrowRight', 'd', 'D'].includes(e.key)) input.kr = false;
  if ([' ', 'ArrowDown', 's', 'S'].includes(e.key)) input.kb = false;
});
$('menu').addEventListener('click', startRace);
$('res').addEventListener('click', () => { if (st.endT > 1.2) startRace(); });
$('bfx').addEventListener('click', () => { fx = !fx; $('bfx').textContent = fx ? 'FX ON' : 'FX OFF'; });
$('bsnd').addEventListener('click', () => {
  sound = !sound; $('bsnd').textContent = sound ? 'SON ON' : 'SON OFF';
  if (master) master.gain.value = sound ? .45 : 0;
});
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  document.hidden ? ac.suspend() : ac.resume();
});

// ---------- Minimap ----------
const mapCv = $('map'), mapCtx = mapCv.getContext('2d');
const mapBg = document.createElement('canvas'); mapBg.width = mapBg.height = 220;
let mapX0 = Infinity, mapX1 = -Infinity, mapZ0 = Infinity, mapZ1 = -Infinity;
P.forEach(p => { mapX0 = Math.min(mapX0, p.x); mapX1 = Math.max(mapX1, p.x); mapZ0 = Math.min(mapZ0, p.z); mapZ1 = Math.max(mapZ1, p.z); });
const mapS = 190 / Math.max(mapX1 - mapX0, mapZ1 - mapZ0);
const mapPt = p => [15 + (p.x - mapX0) * mapS, 15 + (p.z - mapZ0) * mapS];
{
  const g = mapBg.getContext('2d');
  g.strokeStyle = '#ff2bd6'; g.lineWidth = 5; g.shadowColor = '#ff2bd6'; g.shadowBlur = 8;
  g.beginPath(); P.forEach((p, i) => { const [x, y] = mapPt(p); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); g.stroke();
  const [sx, sy] = mapPt(P[0]); g.fillStyle = '#fff'; g.shadowBlur = 0; g.fillRect(sx - 6, sy - 2, 12, 4);
}
function drawMap(pos) {
  mapCtx.clearRect(0, 0, 220, 220);
  mapCtx.drawImage(mapBg, 0, 0);
  const [x, y] = mapPt(pos);
  mapCtx.fillStyle = '#7df9ff'; mapCtx.shadowColor = '#00e5ff'; mapCtx.shadowBlur = 10;
  mapCtx.beginPath(); mapCtx.arc(x, y, 7, 0, Math.PI * 2); mapCtx.fill(); mapCtx.shadowBlur = 0;
}

// ---------- Boucle ----------
const perf = { n: 0, sum: 0, done: false };
const Fs = mkF(), Fc = mkF(), Fl = mkF();
const shipPos = new V3(), camTarget = new V3(), lookAt = new V3(), upSmooth = new V3(0, 1, 0), tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler(), back = new V3(), sideP = new V3();
let camX = 0, time = 0;

function update(dt, rawDt) {
  time += dt;
  const racing = st.mode === 'race';
  const left = input.tl || input.kl, right = input.tr || input.kr;
  const brake = (left && right) || input.kb;
  $('pl').classList.toggle('on', left && racing);
  $('pr').classList.toggle('on', right && racing);

  if (st.mode === 'countdown') {
    st.count -= dt;
    const c = Math.ceil(st.count);
    if (c !== lastCount) {
      lastCount = c;
      if (c > 0) { flash(String(c), 1); sfx.count(); }
    }
    if (st.count <= 0) { st.mode = 'race'; flash('GO!', .8); sfx.go(); }
  }

  frame(st.s, Fs);
  const k = Fs.k;
  if (st.mode === 'race') {
    st.raceT += dt;
    let steerIn = (right ? 1 : 0) - (left ? 1 : 0);
    if (brake) { steerIn = 0; st.v = Math.max(30, st.v - 90 * dt); }
    else if (st.v < VMAX) st.v = Math.min(VMAX, st.v + (25 + (VMAX - st.v) * .6) * dt);
    else st.v -= (st.v - VMAX) * .9 * dt;
    st.steer += (steerIn - st.steer) * Math.min(1, 12 * dt);
    st.lat += (st.steer * LAT - st.lat) * Math.min(1, 10 * dt);
    if (!perf.done) {
      perf.n++; perf.sum += rawDt;
      if (perf.n >= 150) {
        perf.done = true;
        if (perf.sum / perf.n > .024 && fx) { fx = false; $('bfx').textContent = 'FX OFF'; }
      }
    }
  } else if (st.mode === 'countdown') {
    st.v = 0; st.lat = 0; st.steer = 0;
  } else {
    // pilote auto (menu / arrivée)
    const target = st.mode === 'menu' ? 105 : 70;
    st.v += (target - st.v) * Math.min(1, 1.5 * dt);
    const want = THREE.MathUtils.clamp(k * st.v * st.v * CF - st.x * 1.5, -LAT, LAT);
    st.lat += (want - st.lat) * Math.min(1, 6 * dt);
    st.steer += (want / LAT - st.steer) * Math.min(1, 6 * dt);
  }

  st.x += (st.lat - k * st.v * st.v * CF) * dt;
  const lim = HALF - 2.4;
  let touching = 0;
  if (st.x > lim) { st.x = lim; if (st.lat > 0) st.lat *= -.4; touching = 1; }
  if (st.x < -lim) { st.x = -lim; if (st.lat < 0) st.lat *= -.4; touching = -1; }
  st.wallCD -= dt; st.padCD -= dt;
  if (touching && st.mode === 'race') {
    if (st.wallCD <= 0 && st.v > 40) { st.v *= .88; st.wallCD = .35; st.shake = .6; sfx.hit(); spawnSparks(trackPos(st.s, st.x + touching * 2.2, .8, sideP), Fs.t, Fs.u, st.v, 14); }
    else { st.v = Math.max(30, st.v - 25 * dt); if (Math.random() < .5) spawnSparks(trackPos(st.s, st.x + touching * 2.2, .8, sideP), Fs.t, Fs.u, st.v, 2); }
  }

  st.s += st.v * dt;
  if (st.s >= L) {
    st.s -= L;
    if (st.mode === 'race') {
      st.laps.push(st.raceT - st.lapStart);
      st.lapStart = st.raceT;
      sfx.lap();
      if (st.laps.length >= LAPS) finishRace();
      else flash(st.laps.length === LAPS - 1 ? 'DERNIER TOUR' : `TOUR ${st.laps.length + 1}`, 1.2);
    }
  }

  if (st.mode === 'race' && st.padCD <= 0) {
    for (const p of PADS) {
      const d = ((st.s - p.s) % L + L) % L;
      if (d < p.len && Math.abs(st.x - p.x) < p.w / 2) {
        st.v = Math.min(st.v + 65, BOOSTMAX); st.boost = 1.2; st.padCD = .6; st.shake = Math.max(st.shake, .3); sfx.boost();
        break;
      }
    }
  }
  st.boost = Math.max(0, st.boost - dt);
  st.shake = Math.max(0, st.shake - dt * 2);

  if (st.mode === 'finish') {
    st.endT += dt;
    if (st.endT > 1.2 && $('res').classList.contains('hidden')) $('res').classList.remove('hidden');
  }

  // Vaisseau
  frame(st.s, Fs);
  trackPos(st.s, st.x, 1.1 + Math.sin(time * 5) * .08, shipPos);
  ship.g.position.copy(shipPos);
  back.copy(Fs.t).negate();
  tmpM.makeBasis(Fs.r, Fs.u, back);
  ship.g.quaternion.setFromRotationMatrix(tmpM);
  tmpQ.setFromEuler(tmpE.set(0, -st.steer * .18, -st.steer * .5));
  ship.g.quaternion.multiply(tmpQ);
  const fl = .5 + st.v / VMAX * .7 + st.boost * 1.2 + Math.random() * .15;
  ship.flames.forEach((f, i) => { f.scale.z = (i % 2 ? .6 : 1) * fl; });

  // Caméra
  camX += (st.x - camX) * Math.min(1, 8 * dt);
  const dist = 8.5 + st.v * .015;
  frame(st.s - dist, Fc);
  camTarget.copy(Fc.p).addScaledVector(Fc.r, camX * .75).addScaledVector(Fc.u, 3.6);
  frame(st.s + 16, Fl);
  lookAt.copy(Fl.p).addScaledVector(Fl.r, camX * .85).addScaledVector(Fl.u, 1.2);
  if (st.shake > 0) lookAt.add(new V3((Math.random() - .5), (Math.random() - .5), (Math.random() - .5)).multiplyScalar(st.shake * 1.2));
  camera.position.copy(camTarget);
  upSmooth.lerp(Fc.u, Math.min(1, 6 * dt)).normalize();
  camera.up.copy(upSmooth);
  camera.lookAt(lookAt);
  const fov = 70 + Math.min(st.v, BOOSTMAX) / VMAX * 12 + st.boost * 6;
  camera.fov += (fov - camera.fov) * Math.min(1, 4 * dt);
  camera.updateProjectionMatrix();

  sun.position.copy(camera.position).addScaledVector(SUN_DIR, 1900);
  sun.lookAt(camera.position);
  stars.position.copy(camera.position);
  padTex.offset.y -= dt * 1.5;

  updateSparks(dt);
  updateSpeedLines(dt, st.v);
  engineUpdate(st.v, st.boost, st.mode === 'race');

  // HUD
  const lapN = Math.min(st.laps.length + 1, LAPS);
  $('lap').textContent = `${lapN}/${LAPS}`;
  $('time').textContent = fmt(st.mode === 'menu' ? 0 : st.raceT);
  $('best').textContent = fmt(best.lap);
  $('kmh').textContent = Math.round(st.v * KMH);
  $('barf').style.width = `${Math.min(100, st.v / BOOSTMAX * 100)}%`;
  if (st.msgT > 0) { st.msgT -= dt; if (st.msgT <= 0) $('big').textContent = ''; }
  drawMap(shipPos);
}

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const raw = clock.getDelta();
  update(Math.min(raw, .05), raw);
  if (fx) composer.render(); else renderer.render(scene, camera);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
